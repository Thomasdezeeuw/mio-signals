[package]
name          = "mio-signals"
description   = "Crate for handling signals with Mio."
version       = "0.3.0"
authors       = ["Thomas de Zeeuw <thomasdezeeuw@gmail.com>"]
license       = "MIT"
documentation = "https://docs.rs/mio-signals"
repository    = "https://github.com/Thomasdezeeuw/mio-signals"
readme        = "README.md"
keywords      = ["signals", "mio"]
include       = ["/Cargo.toml", "/src/**/*.rs", "/README.md", "/LICENSE"]
edition       = "2021"
rust-version  = "1.71"

[dependencies]
libc = { version = "0.2.178", default-features = false }
log  = { version = "0.4.29", default-features = false }
# Need `SourceFd` from `os-util`.
mio  = { version = "1.1", default-features = false , features = ["os-ext"] }

[[test]]
name    = "multi_threaded"
harness = false
